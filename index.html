<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pour Toi & Moi</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      overflow: hidden;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 190px 1fr 190px;
      background: white;
    }

    .side-gif {
      height: 100vh;
      background-image: url("assets/bordure-coeur.gif");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .side-gif::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 65px;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.92));
      pointer-events: none;
    }

    .side-gif:last-child::after {
      right: auto;
      left: 0;
      background: linear-gradient(to left, rgba(255,255,255,0), rgba(255,255,255,0.92));
    }

    .content {
      position: relative;
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #fff 60%, #fff7fb 100%);
      overflow: hidden;
    }

    .section {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(0.985);
      transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s ease;
      pointer-events: none;
    }

    .section.active-section {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .page-label {
      position: absolute;
      top: 28px;
      left: 34px;
      z-index: 50;
      display: none;
      padding: 12px 22px;
      border-radius: 18px;
      background: rgba(255, 180, 215, 0.72);
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(255, 70, 150, 0.55);
      box-shadow: 0 10px 35px rgba(255, 90, 170, 0.24);
      backdrop-filter: blur(12px);
    }

    .page-label.show { display: block; }

    .title-box {
      width: 520px;
      height: 120px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 50px;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      text-shadow: 0 2px 10px rgba(255, 70, 150, 0.55);
      box-shadow: 0 10px 26px rgba(255, 80, 160, 0.22);
      background-image: url("assets/bouton-haut.gif");
      background-size: cover;
      background-position: center;
      position: absolute;
      left: 50%;
      top: calc(50% - 75px);
      transform: translate(-50%, -50%);
      z-index: 5;
      animation: softFloat 4s ease-in-out infinite;
    }

    .enter-btn, .back-btn, .pink-btn {
      border: none;
      border-radius: 15px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
      background-image: url("assets/bouton-entrer.gif");
      background-size: cover;
      background-position: center;
      text-shadow: 0 2px 8px rgba(255, 70, 150, 0.55);
      box-shadow: 0 8px 22px rgba(255, 80, 160, 0.2);
      transition: filter 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      z-index: 10;
    }

    .enter-btn {
      width: 230px;
      height: 66px;
      font-size: 28px;
      position: absolute;
      left: 50%;
      top: calc(50% + 45px);
      transform: translate(-50%, -50%);
    }

    .back-btn {
      width: 190px;
      height: 58px;
      font-size: 24px;
      position: absolute;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
    }

    .enter-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 24px rgba(255, 90, 170, 0.45);
      transform: translate(-50%, -50%) scale(1.04);
    }

    .back-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 24px rgba(255, 90, 170, 0.45);
      transform: translateX(-50%) scale(1.04);
    }

    .pink-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 24px rgba(255, 90, 170, 0.45);
      transform: scale(1.04);
    }

    .menu-container {
      position: absolute;
      top: 28px;
      right: 34px;
      z-index: 50;
      display: none;
    }

    .menu-container.show { display: block; }

    .menu-btn {
      width: 58px;
      height: 50px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      background: rgba(255, 150, 200, 0.45);
      box-shadow: 0 8px 22px rgba(255, 100, 180, 0.22);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .menu-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 24px rgba(255, 90, 170, 0.45);
    }

    .menu-btn span {
      width: 30px;
      height: 4px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 0 8px rgba(255, 80, 170, 0.6);
    }

    .dropdown-menu {
      position: absolute;
      top: 64px;
      right: 0;
      width: 220px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(255, 180, 215, 0.72);
      box-shadow: 0 10px 35px rgba(255, 90, 170, 0.28);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: menuAppear 0.25s ease;
    }

    .dropdown-menu.active { display: flex; }

    .dropdown-menu button {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.45);
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(255, 70, 150, 0.55);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .dropdown-menu button:hover {
      transform: scale(1.04);
      background: rgba(255, 255, 255, 0.65);
    }

    .heart, .sparkle, .butterfly, .petal, .heart-line {
      position: absolute;
      pointer-events: none;
      user-select: none;
    }

    .heart {
      color: #ff8fc3;
      filter: drop-shadow(0 0 12px rgba(255, 130, 190, 0.45));
      animation: heartFloat 5s ease-in-out infinite;
      opacity: 0.75;
    }

    .sparkle {
      color: #ff87bd;
      animation: sparkle 2.8s ease-in-out infinite;
      opacity: 0.8;
    }

    .butterfly {
      top: 13%;
      right: 22%;
      font-size: 58px;
      filter: drop-shadow(0 0 14px rgba(255, 120, 190, 0.45));
      animation: butterflyFly 4.8s ease-in-out infinite;
      z-index: 2;
    }

    .petal {
      font-size: 26px;
      opacity: 0.72;
      animation: petalFall linear infinite;
      filter: drop-shadow(0 0 8px rgba(255,140,190,0.25));
    }

    .heart-line {
      right: 15%;
      bottom: 22%;
      width: 280px;
      height: 105px;
      border-bottom: 3px dashed rgba(255, 105, 180, 0.6);
      border-radius: 50%;
      transform: rotate(8deg);
      opacity: 0.7;
    }

    .heart-line::before {
      content: "♡";
      position: absolute;
      left: 55px;
      top: 15px;
      color: #ff78b5;
      font-size: 70px;
      transform: rotate(-20deg);
    }

    .shadow-glow {
      width: 300px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 110, 180, 0.24);
      filter: blur(14px);
      position: absolute;
      left: 50%;
      top: calc(50% + 95px);
      transform: translateX(-50%);
      animation: glowPulse 3s ease-in-out infinite;
      z-index: 3;
    }

    .photo-wall-controls,
    .word-wall-controls {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .photo-input { display: none; }

    .word-input {
      width: 360px;
      max-width: 52vw;
      height: 52px;
      padding: 0 18px;
      border: none;
      border-radius: 18px;
      outline: none;
      background: rgba(255, 220, 235, 0.78);
      color: #d94d88;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 8px 22px rgba(255, 90, 170, 0.16);
      backdrop-filter: blur(10px);
    }

    .word-input::placeholder { color: rgba(217, 77, 136, 0.55); }

    .photo-status,
    .word-status {
      position: absolute;
      top: 155px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 31;
      color: #ff7db8;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 1px 8px rgba(255, 170, 210, 0.5);
    }

    .photo-wall,
    .word-wall {
      position: absolute;
      left: 5%;
      top: 175px;
      width: 90%;
      height: calc(100% - 310px);
      z-index: 8;
      overflow: hidden;
    }

    .photo-page,
    .word-page {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateX(20px);
      transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
    }

    .photo-page.active,
    .word-page.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .polaroid {
      position: absolute;
      width: 160px;
      height: 205px;
      background: #fff;
      padding: 10px 10px 42px 10px;
      box-shadow: 0 10px 24px rgba(255, 90, 170, 0.18), 0 6px 18px rgba(0,0,0,0.12);
      border-radius: 3px;
      animation: polaroidAppear 0.45s ease;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .polaroid:hover {
      z-index: 50;
      box-shadow: 0 12px 28px rgba(255, 90, 170, 0.28), 0 8px 22px rgba(0,0,0,0.18);
    }

    .polaroid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      pointer-events: none;
      user-select: none;
    }

    .word-bubble {
      position: absolute;
      min-width: 160px;
      max-width: 240px;
      min-height: 75px;
      padding: 18px 20px;
      border-radius: 28px 28px 28px 8px;
      background: linear-gradient(135deg, rgba(255, 180, 215, 0.88), rgba(255, 220, 238, 0.9));
      color: white;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.25;
      text-align: center;
      text-shadow: 0 2px 8px rgba(255, 70, 150, 0.55);
      box-shadow: 0 10px 26px rgba(255, 90, 170, 0.22);
      backdrop-filter: blur(10px);
      animation: bubbleAppear 0.45s ease;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow-wrap: break-word;
    }

    .word-bubble::after {
      content: "♥";
      position: absolute;
      right: 14px;
      bottom: 8px;
      font-size: 18px;
      color: rgba(255,255,255,0.8);
    }

    .word-bubble:hover {
      z-index: 50;
      box-shadow: 0 14px 30px rgba(255, 90, 170, 0.3);
    }

    .delete-photo,
    .delete-word {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(255, 110, 170, 0.92);
      color: white;
      font-size: 17px;
      box-shadow: 0 6px 16px rgba(255, 90, 170, 0.35);
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 80;
    }

    .polaroid:hover .delete-photo,
    .polaroid.show-delete .delete-photo,
    .word-bubble:hover .delete-word,
    .word-bubble.show-delete .delete-word {
      opacity: 1;
      transform: scale(1);
    }

    .photo-pages-buttons,
    .word-pages-buttons {
      position: absolute;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%);
      z-index: 30;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 18px;
      background: rgba(255, 180, 215, 0.6);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(255, 90, 170, 0.18);
    }

    .photo-pages-buttons.show,
    .word-pages-buttons.show {
      display: flex;
    }

    .photo-page-btn,
    .word-page-btn {
      min-width: 76px;
      height: 36px;
      padding: 0 12px;
      border: none;
      border-radius: 13px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(255, 140, 195, 0.7);
      text-shadow: 0 2px 8px rgba(255, 70, 150, 0.55);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .photo-page-btn:hover,
    .word-page-btn:hover {
      transform: scale(1.06);
      background: rgba(255, 120, 185, 0.85);
    }

    .photo-page-btn.active,
    .word-page-btn.active {
      background: rgba(255, 95, 170, 0.95);
      box-shadow: 0 0 16px rgba(255, 90, 170, 0.35);
    }

    @keyframes softFloat {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-7px); }
    }

    @keyframes menuAppear {
      from { opacity: 0; transform: translateY(-10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes polaroidAppear {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; }
    }

    @keyframes bubbleAppear {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; }
    }

    @keyframes heartFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.08); }
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.35; }
      50% { transform: scale(1.25) rotate(20deg); opacity: 1; }
    }

    @keyframes butterflyFly {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(-28px, 18px) rotate(10deg); }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.45; transform: translateX(-50%) scaleX(0.9); }
      50% { opacity: 0.8; transform: translateX(-50%) scaleX(1.15); }
    }

    @keyframes petalFall {
      0% { transform: translateY(-120px) rotate(0deg); opacity: 0; }
      10% { opacity: .8; }
      100% { transform: translateY(115vh) translateX(40px) rotate(260deg); opacity: 0; }
    }

    @media (max-width: 768px) {
      .page { display: block; position: relative; }

      .side-gif {
        position: absolute;
        top: 0;
        width: 50vw;
        height: 100vh;
      }

      .side-gif:first-child { left: 0; }
      .side-gif:last-child { right: 0; }
      .side-gif::after { width: 90px; }

      .content {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        background: linear-gradient(
          to right,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,.96) 42%,
          #fff 50%,
          rgba(255,255,255,.96) 58%,
          rgba(255,255,255,0) 100%
        );
      }

      .title-box {
        width: 82vw;
        max-width: 420px;
        height: 90px;
        font-size: 38px;
        top: 42%;
      }

      .enter-btn {
        width: 58vw;
        max-width: 260px;
        height: 65px;
        font-size: 30px;
        top: 54%;
      }

      .back-btn {
        width: 52vw;
        max-width: 230px;
        height: 58px;
        font-size: 24px;
        bottom: 28px;
      }

      .page-label {
        top: 18px;
        left: 18px;
        font-size: 15px;
        padding: 10px 16px;
      }

      .menu-container {
        top: 18px;
        right: 18px;
      }

      .menu-btn {
        width: 52px;
        height: 46px;
      }

      .dropdown-menu {
        width: 190px;
        top: 58px;
      }

      .shadow-glow { top: 61%; }

      .butterfly {
        font-size: 42px;
        right: 16%;
        top: 14%;
      }

      .heart-line {
        right: 6%;
        bottom: 22%;
        transform: scale(.75) rotate(8deg);
      }

      .photo-wall-controls,
      .word-wall-controls {
        top: 82px;
        width: 92%;
        gap: 8px;
      }

      .word-input {
        max-width: 58vw;
        width: 58vw;
        height: 48px;
        font-size: 14px;
      }

      .photo-status,
      .word-status {
        top: 140px;
        width: 90%;
        font-size: 13px;
      }

      .photo-wall,
      .word-wall {
        left: 3%;
        width: 94%;
        top: 165px;
        height: calc(100% - 285px);
      }

      .polaroid {
        width: 112px;
        height: 145px;
        padding: 7px 7px 30px 7px;
      }

      .word-bubble {
        min-width: 112px;
        max-width: 138px;
        min-height: 52px;
        padding: 10px 12px;
        font-size: 13px;
        border-radius: 20px 20px 20px 7px;
        line-height: 1.15;
      }

      .delete-photo,
      .delete-word {
        opacity: 0;
      }

      .photo-pages-buttons,
      .word-pages-buttons {
        bottom: 94px;
        max-width: 90%;
      }

      .photo-page-btn,
      .word-page-btn {
        min-width: 65px;
        height: 32px;
        font-size: 13px;
      }

      /* Optimisation mobile : moins d'animations lourdes pour éviter les lags */
      .petal {
        display: none;
      }

      .heart,
      .sparkle {
        animation-duration: 6s;
      }

      .butterfly {
        animation-duration: 7s;
      }

      .side-gif {
        background-size: cover;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <aside class="side-gif"></aside>

    <section class="content">
      <div class="page-label" id="pageLabel">Mot du jour</div>

      <div class="menu-container" id="menuContainer">
        <button class="menu-btn" onclick="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="dropdown-menu" id="dropdownMenu">
          <button onclick="goToPage(2)">Mot du jour</button>
          <button onclick="goToPage(3)">Mur photo</button>
          <button onclick="goToPage(4)">Mur de mot</button>
          <button onclick="goToPage(5)">Quizz</button>
        </div>
      </div>

      <span class="sparkle" style="top: 12%; left: 18%; font-size: 32px;">✦</span>
      <span class="sparkle" style="top: 20%; left: 28%; font-size: 18px; animation-delay: .7s;">✦</span>
      <span class="sparkle" style="top: 14%; right: 14%; font-size: 38px; animation-delay: .3s;">✦</span>
      <span class="sparkle" style="top: 47%; right: 22%; font-size: 22px; animation-delay: 1s;">✦</span>
      <span class="sparkle" style="bottom: 23%; left: 22%; font-size: 34px; animation-delay: 1.5s;">✦</span>
      <span class="sparkle" style="bottom: 29%; right: 16%; font-size: 30px; animation-delay: .9s;">✦</span>

      <span class="heart" style="top: 13%; left: 9%; font-size: 38px;">♥</span>
      <span class="heart" style="top: 35%; left: 8%; font-size: 28px; animation-delay: 1.2s;">♥</span>
      <span class="heart" style="bottom: 31%; left: 13%; font-size: 62px; animation-delay: .5s;">♥</span>
      <span class="heart" style="top: 50%; right: 15%; font-size: 42px; animation-delay: 1.6s;">♥</span>

      <span class="butterfly">🦋</span>

      <span class="petal" style="left:12%; top:-5%; animation-duration:10s; animation-delay:0s;">🌸</span>
      <span class="petal" style="left:24%; top:-8%; animation-duration:13s; animation-delay:2s;">🌸</span>
      <span class="petal" style="left:41%; top:-6%; animation-duration:11s; animation-delay:1s;">🌸</span>
      <span class="petal" style="left:58%; top:-9%; animation-duration:14s; animation-delay:3s;">🌸</span>
      <span class="petal" style="left:72%; top:-7%; animation-duration:12s; animation-delay:4s;">🌸</span>
      <span class="petal" style="left:86%; top:-4%; animation-duration:15s; animation-delay:1.5s;">🌸</span>

      <div class="heart-line"></div>

      <div id="page1" class="section active-section">
        <div class="title-box">Pour Toi &amp; Moi ♥</div>
        <button class="enter-btn" onclick="goToPage(2)">Entrer</button>
        <div class="shadow-glow"></div>
      </div>

      <div id="page2" class="section">
        <button class="back-btn" onclick="goBack()">Retour</button>
      </div>

      <div id="page3" class="section">
        <div class="photo-wall-controls">
          <label class="pink-btn" style="padding: 16px 22px;">
            Ajouter une photo
            <input id="photoInput" class="photo-input" type="file" accept="image/*" multiple>
          </label>
        </div>

        <div class="photo-status" id="photoStatus">Chargement du mur photo...</div>
        <div class="photo-wall" id="photoWall"></div>
        <div class="photo-pages-buttons" id="photoPagesButtons"></div>

        <button class="back-btn" onclick="goBack()">Retour</button>
      </div>

      <div id="page4" class="section">
        <div class="word-wall-controls">
          <input id="wordInput" class="word-input" type="text" maxlength="120" placeholder="Écris un mot doux..." />
          <button class="pink-btn" style="height:52px; padding: 0 20px;" onclick="addWord()">Ajouter</button>
        </div>

        <div class="word-status" id="wordStatus">Chargement du mur de mot...</div>
        <div class="word-wall" id="wordWall"></div>
        <div class="word-pages-buttons" id="wordPagesButtons"></div>

        <button class="back-btn" onclick="goBack()">Retour</button>
      </div>

      <div id="page5" class="section">
        <button class="back-btn" onclick="goBack()">Retour</button>
      </div>
    </section>

    <aside class="side-gif"></aside>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDqxNaDG8Vn8rK6-6z8wlsIcU3CaWfGb8",
      authDomain: "site-couple.firebaseapp.com",
      projectId: "site-couple",
      storageBucket: "site-couple.firebasestorage.app",
      messagingSenderId: "646872298410",
      appId: "1:646872298410:web:f94dbeb116ad2b5b35f1d3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentPage = 1;
    const historyPages = [];

    const pageNames = {
      1: "Accueil",
      2: "Mot du jour",
      3: "Mur photo",
      4: "Mur de mot",
      5: "Quizz"
    };

    const maxPhotosPerPage = 8;
    const maxWordsPerPage = window.innerWidth <= 768 ? 4 : 8;

    let photos = [];
    let words = [];
    let currentPhotoPage = 0;
    let currentWordPage = 0;
    let longPressTimer = null;
    let photosLoadedOnce = false;
    let wordsLoadedOnce = false;

    window.toggleMenu = function() {
      document.getElementById("dropdownMenu").classList.toggle("active");
    };

    function updateInterface() {
      const menu = document.getElementById("menuContainer");
      const dropdown = document.getElementById("dropdownMenu");
      const label = document.getElementById("pageLabel");

      label.textContent = pageNames[currentPage];

      if (currentPage === 1) {
        menu.classList.remove("show");
        label.classList.remove("show");
        dropdown.classList.remove("active");
      } else {
        menu.classList.add("show");
        label.classList.add("show");
      }

      if (currentPage === 3) renderPhotoWall();
      if (currentPage === 4) renderWordWall();
    }

    window.goToPage = function(pageNumber) {
      if (pageNumber === currentPage) {
        document.getElementById("dropdownMenu").classList.remove("active");
        return;
      }

      historyPages.push(currentPage);

      document.getElementById("page" + currentPage).classList.remove("active-section");
      document.getElementById("page" + pageNumber).classList.add("active-section");

      currentPage = pageNumber;

      document.getElementById("dropdownMenu").classList.remove("active");
      updateInterface();
    };

    window.goBack = function() {
      if (historyPages.length === 0) return;

      const previousPage = historyPages.pop();

      document.getElementById("page" + currentPage).classList.remove("active-section");
      document.getElementById("page" + previousPage).classList.add("active-section");

      currentPage = previousPage;

      document.getElementById("dropdownMenu").classList.remove("active");
      updateInterface();
    };

    document.getElementById("photoInput").addEventListener("change", async function(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      setPhotoStatus("Ajout en cours...");

      for (const file of files) {
        try {
          const compressedImage = await compressImage(file);
          const pageIndex = Math.floor(photos.length / maxPhotosPerPage);
          const indexInPage = photos.length % maxPhotosPerPage;
          const position = getNonOverlappingPosition(indexInPage, "photo");

          await addDoc(collection(db, "murPhotos"), {
            src: compressedImage,
            rotation: randomNumber(-10, 10),
            x: position.x,
            y: position.y,
            createdAt: serverTimestamp()
          });

          currentPhotoPage = pageIndex;
        } catch (error) {
          console.error(error);
          alert("Erreur pendant l'ajout de la photo.");
        }
      }

      event.target.value = "";
      setPhotoStatus("");
    });

    window.addWord = async function() {
      const input = document.getElementById("wordInput");
      const text = input.value.trim();

      if (!text) return;

      setWordStatus("Ajout du mot...");

      try {
        const pageIndex = Math.floor(words.length / maxWordsPerPage);
        const indexInPage = words.length % maxWordsPerPage;
        const position = getNonOverlappingPosition(indexInPage, "word");

        await addDoc(collection(db, "murMots"), {
          text: text,
          rotation: window.innerWidth <= 768 ? randomNumber(-2, 2) : randomNumber(-5, 5),
          x: position.x,
          y: position.y,
          createdAt: serverTimestamp()
        });

        currentWordPage = pageIndex;
        input.value = "";
        setWordStatus("");
      } catch (error) {
        console.error(error);
        alert("Erreur pendant l'ajout du mot.");
        setWordStatus("");
      }
    };

    document.getElementById("wordInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        window.addWord();
      }
    });

    function listenPhotos() {
      const q = query(collection(db, "murPhotos"), orderBy("createdAt", "asc"));

      onSnapshot(q, function(snapshot) {
        photos = [];

        snapshot.forEach(function(docSnap) {
          photos.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        photosLoadedOnce = true;
        setPhotoStatus("");

        const totalPages = Math.max(1, Math.ceil(photos.length / maxPhotosPerPage));
        if (currentPhotoPage > totalPages - 1) currentPhotoPage = totalPages - 1;

        renderPhotoWall();
      }, function(error) {
        console.error(error);
        setPhotoStatus("Erreur de chargement Firebase.");
      });
    }

    function listenWords() {
      const q = query(collection(db, "murMots"), orderBy("createdAt", "asc"));

      onSnapshot(q, function(snapshot) {
        words = [];

        snapshot.forEach(function(docSnap) {
          words.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        wordsLoadedOnce = true;
        setWordStatus("");

        const totalPages = Math.max(1, Math.ceil(words.length / maxWordsPerPage));
        if (currentWordPage > totalPages - 1) currentWordPage = totalPages - 1;

        renderWordWall();
      }, function(error) {
        console.error(error);
        setWordStatus("Erreur de chargement Firebase.");
      });
    }

    function setPhotoStatus(text) {
      const status = document.getElementById("photoStatus");
      status.textContent = text;
    }

    function setWordStatus(text) {
      const status = document.getElementById("wordStatus");
      status.textContent = text;
    }

    function getNonOverlappingPosition(index, type) {
      const desktopPhotoPositions = [
        {x: 4, y: 4}, {x: 28, y: 2}, {x: 54, y: 5}, {x: 76, y: 3},
        {x: 10, y: 43}, {x: 34, y: 45}, {x: 58, y: 42}, {x: 78, y: 46}
      ];

      const mobilePhotoPositions = [
        {x: 2, y: 2}, {x: 37, y: 4},
        {x: 8, y: 32}, {x: 48, y: 34},
        {x: 3, y: 62}, {x: 43, y: 64},
        {x: 22, y: 18}, {x: 28, y: 50}
      ];

      const desktopWordPositions = [
        {x: 5, y: 5}, {x: 34, y: 3}, {x: 65, y: 6},
        {x: 14, y: 34}, {x: 45, y: 36}, {x: 72, y: 33},
        {x: 24, y: 66}, {x: 56, y: 64}
      ];

      const mobileWordPositions = [
        {x: 6, y: 7},
        {x: 55, y: 25},
        {x: 8, y: 48},
        {x: 51, y: 70}
      ];

      const isMobile = window.innerWidth <= 768;

      if (type === "word") {
        const positions = isMobile ? mobileWordPositions : desktopWordPositions;
        return positions[index % positions.length];
      }

      const positions = isMobile ? mobilePhotoPositions : desktopPhotoPositions;
      return positions[index % positions.length];
    }

    function renderPhotoWall() {
      const wall = document.getElementById("photoWall");
      const buttonsContainer = document.getElementById("photoPagesButtons");

      wall.innerHTML = "";
      buttonsContainer.innerHTML = "";

      if (!photosLoadedOnce) {
        setPhotoStatus("Chargement du mur photo...");
        return;
      }

      if (photos.length === 0) {
        setPhotoStatus("Aucune photo pour le moment.");
      } else {
        setPhotoStatus("");
      }

      const totalPages = Math.max(1, Math.ceil(photos.length / maxPhotosPerPage));

      if (currentPhotoPage > totalPages - 1) currentPhotoPage = totalPages - 1;

      for (let i = 0; i < totalPages; i++) {
        const page = document.createElement("div");
        page.className = "photo-page" + (i === currentPhotoPage ? " active" : "");

        const start = i * maxPhotosPerPage;
        const pagePhotos = photos.slice(start, start + maxPhotosPerPage);

        pagePhotos.forEach((photo) => {
          const polaroid = document.createElement("div");
          polaroid.className = "polaroid";
          polaroid.style.left = photo.x + "%";
          polaroid.style.top = photo.y + "%";
          polaroid.style.transform = "rotate(" + photo.rotation + "deg)";

          const img = document.createElement("img");
          img.src = photo.src;

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-photo";
          deleteBtn.innerHTML = "🗑";
          deleteBtn.onclick = async function(e) {
            e.stopPropagation();
            await deletePhoto(photo.id);
          };

          addLongPressDelete(polaroid);

          polaroid.appendChild(img);
          polaroid.appendChild(deleteBtn);
          page.appendChild(polaroid);
        });

        wall.appendChild(page);
      }

      renderPageButtons(buttonsContainer, totalPages, currentPhotoPage, "photo");
    }

    function renderWordWall() {
      const wall = document.getElementById("wordWall");
      const buttonsContainer = document.getElementById("wordPagesButtons");

      wall.innerHTML = "";
      buttonsContainer.innerHTML = "";

      if (!wordsLoadedOnce) {
        setWordStatus("Chargement du mur de mot...");
        return;
      }

      if (words.length === 0) {
        setWordStatus("Aucun mot pour le moment.");
      } else {
        setWordStatus("");
      }

      const totalPages = Math.max(1, Math.ceil(words.length / maxWordsPerPage));

      if (currentWordPage > totalPages - 1) currentWordPage = totalPages - 1;

      for (let i = 0; i < totalPages; i++) {
        const page = document.createElement("div");
        page.className = "word-page" + (i === currentWordPage ? " active" : "");

        const start = i * maxWordsPerPage;
        const pageWords = words.slice(start, start + maxWordsPerPage);

        pageWords.forEach((word) => {
          const bubble = document.createElement("div");
          bubble.className = "word-bubble";
          bubble.style.left = word.x + "%";
          bubble.style.top = word.y + "%";
          bubble.style.transform = "rotate(" + word.rotation + "deg)";
          bubble.textContent = word.text;

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-word";
          deleteBtn.innerHTML = "🗑";
          deleteBtn.onclick = async function(e) {
            e.stopPropagation();
            await deleteWord(word.id);
          };

          addLongPressDelete(bubble);

          bubble.appendChild(deleteBtn);
          page.appendChild(bubble);
        });

        wall.appendChild(page);
      }

      renderPageButtons(buttonsContainer, totalPages, currentWordPage, "word");
    }

    function renderPageButtons(container, totalPages, currentIndex, type) {
      if (totalPages > 1) {
        container.classList.add("show");

        for (let i = 0; i < totalPages; i++) {
          const btn = document.createElement("button");
          btn.className = (type === "word" ? "word-page-btn" : "photo-page-btn") + (i === currentIndex ? " active" : "");
          btn.textContent = "Page " + (i + 1);

          btn.onclick = function() {
            if (type === "word") {
              currentWordPage = i;
              renderWordWall();
            } else {
              currentPhotoPage = i;
              renderPhotoWall();
            }
          };

          container.appendChild(btn);
        }
      } else {
        container.classList.remove("show");
      }
    }

    function addLongPressDelete(element) {
      element.addEventListener("touchstart", function() {
        longPressTimer = setTimeout(() => {
          element.classList.add("show-delete");
        }, 650);
      });

      element.addEventListener("touchend", function() {
        clearTimeout(longPressTimer);
      });

      element.addEventListener("touchmove", function() {
        clearTimeout(longPressTimer);
      });
    }

    async function deletePhoto(photoId) {
      if (!confirm("Supprimer cette photo ?")) return;

      try {
        await deleteDoc(doc(db, "murPhotos", photoId));
      } catch (error) {
        console.error(error);
        alert("Erreur pendant la suppression.");
      }
    }

    async function deleteWord(wordId) {
      if (!confirm("Supprimer ce mot ?")) return;

      try {
        await deleteDoc(doc(db, "murMots", wordId));
      } catch (error) {
        console.error(error);
        alert("Erreur pendant la suppression.");
      }
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = function(event) {
          const img = new Image();

          img.onload = function() {
            const canvas = document.createElement("canvas");
            const maxSize = 900;

            let width = img.width;
            let height = img.height;

            if (width > height && width > maxSize) {
              height = Math.round(height * maxSize / width);
              width = maxSize;
            } else if (height > maxSize) {
              width = Math.round(width * maxSize / height);
              height = maxSize;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };

          img.onerror = reject;
          img.src = event.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function randomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    listenPhotos();
    listenWords();
    updateInterface();
  </script>
</body>
</html>
